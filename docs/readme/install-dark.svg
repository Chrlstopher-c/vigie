<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="382" viewBox="0 0 1040 382" fill="none" role="img">
  <defs><marker id="stp-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8b929c"/></marker></defs>
  <rect width="1040" height="382" rx="16" fill="#0a0b0e" stroke="#20242c"/>
  <text x="30" y="36" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12" letter-spacing="2.5" fill="#8b929c">FROM AN ARCH LAPTOP TO AN IPHONE</text>
  <rect x="30" y="56" width="478" height="139" rx="12" fill="#161b22" stroke="#2a313c"/>
  <circle cx="56" cy="82" r="13" fill="#d8a35f"/>
  <text x="56" y="87" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#0a0b0e">1</text>
  <text x="78" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#f4f1ea">Install the toolchain</text>
  
  <text x="44" y="116" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">swiftly with a Swift 6 toolchain, xtool with the Darwin SDK,</text><text x="44" y="131" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">libimobiledevice for usbmuxd and idevice_id, and Impactor at</text><text x="44" y="146" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">~/.local/opt/Impactor.AppImage.</text><path d="M512 82 l16 0" stroke="#8b929c" stroke-width="1.4" marker-end="url(#stp-dark)"/>
  <rect x="532" y="56" width="478" height="139" rx="12" fill="#161b22" stroke="#2a313c"/>
  <circle cx="558" cy="82" r="13" fill="#d8a35f"/>
  <text x="558" y="87" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#0a0b0e">2</text>
  <text x="580" y="87" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#f4f1ea">Point it at your server</text>
  <rect x="546" y="108" width="450" height="24" rx="6" fill="#0a0b0e" stroke="#20242c"/>
    <text x="556" y="124" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11.5" fill="#d8a35f">cp .env.example .env.local</text>
  <text x="546" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">VIGIE_TUNNEL for the public address, VIGIE_LAN for the fallback at home.</text><text x="546" y="165" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">Without this file the build embeds the example addresses.</text>
  <rect x="30" y="219" width="478" height="139" rx="12" fill="#161b22" stroke="#2a313c"/>
  <circle cx="56" cy="245" r="13" fill="#d8a35f"/>
  <text x="56" y="250" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#0a0b0e">3</text>
  <text x="78" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#f4f1ea">Build the app</text>
  <rect x="44" y="271" width="450" height="24" rx="6" fill="#0a0b0e" stroke="#20242c"/>
    <text x="54" y="287" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11.5" fill="#d8a35f">./build.sh</text>
  <text x="44" y="313" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">Checks the SDK, writes .build/Info.plist from the template with your</text><text x="44" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">addresses, runs xtool dev build --ipa, and prints the size of</text><text x="44" y="343" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">xtool/Vigie.ipa.</text><path d="M512 245 l16 0" stroke="#8b929c" stroke-width="1.4" marker-end="url(#stp-dark)"/>
  <rect x="532" y="219" width="478" height="139" rx="12" fill="#161b22" stroke="#2a313c"/>
  <circle cx="558" cy="245" r="13" fill="#d8a35f"/>
  <text x="558" y="250" text-anchor="middle" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="13" font-weight="700" fill="#0a0b0e">4</text>
  <text x="580" y="250" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14.5" font-weight="600" fill="#f4f1ea">Put it on the phone</text>
  <rect x="546" y="271" width="450" height="24" rx="6" fill="#0a0b0e" stroke="#20242c"/>
    <text x="556" y="287" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11.5" fill="#d8a35f">./deploy.sh</text>
  <text x="546" y="313" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">Rebuilds, checks usbmuxd, names the connected iPhone, opens Impactor.</text><text x="546" y="328" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11.5" fill="#8b929c">Dragging the IPA in to sign and install is the one manual gesture.</text>
</svg>