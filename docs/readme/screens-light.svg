<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="552" viewBox="0 0 1040 552" fill="none" role="img">
  <rect width="1040" height="552" rx="16" fill="#ffffff" stroke="#d0d7de"/>
  <rect x="30" y="24" width="980" height="136" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="46" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#59636e">THE WATCH · WHAT ASKS FOR YOUR HAND</text>
  <rect x="48" y="68" width="16" height="14" rx="4" fill="none" stroke="#d8a35f" stroke-width="1.4"/><circle cx="53" cy="74" r="1.4" fill="#d8a35f"/><circle cx="59" cy="74" r="1.4" fill="#d8a35f"/>
    <text x="76" y="79" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">Quart</text>
    <text x="500" y="79" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">the entry room: pending decisions you can settle on the spot, the pulse of the fleet, the bell</text>
  <path d="M56 96 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="109" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">Décisions</text>
    <text x="500" y="109" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">cards on a rail, approve or refuse behind Face ID, with every server conflict handled</text>
  <path d="M56 126 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="139" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">Alerte</text>
    <text x="500" y="139" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">the alert channel and fleet facts, read and delivered kept apart</text>
  <rect x="30" y="178" width="980" height="166" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="200" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#59636e">THE WORK · WHAT THE TEAMS ARE DOING</text>
  <path d="M49 221 h9 l5 5 v11 h-14 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="233" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">Fil</text>
    <text x="500" y="233" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">threads with the orchestrator, read as a document, renamed, moved or archived</text>
  <path d="M46 251 h7 l3 3 h10 v12 h-20 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="263" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">Parc</text>
    <text x="500" y="263" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">a thread split per sub-agent, and a box to instruct the lead</text>
  <path d="M48 284 h16 M48 289 h16 M48 294 h10" stroke="#d8a35f" stroke-width="1.6" stroke-linecap="round"/>
    <text x="76" y="293" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">Machines</text>
    <text x="500" y="293" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">gauges with thresholds, five-hour and seven-day quotas, wake the PC</text>
  <path d="M49 311 h9 l5 5 v11 h-14 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="323" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">Artefact</text>
    <text x="500" y="323" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">scripts and pages a team produced, code or rendered, in an isolated web view</text>
  <rect x="30" y="362" width="980" height="166" rx="12" fill="#ffffff" stroke="#d0d7de"/>
  <text x="46" y="384" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="11" letter-spacing="2.5" fill="#59636e">THE TOOLS</text>
  <rect x="48" y="406" width="16" height="14" rx="4" fill="none" stroke="#d8a35f" stroke-width="1.4"/><circle cx="53" cy="412" r="1.4" fill="#d8a35f"/><circle cx="59" cy="412" r="1.4" fill="#d8a35f"/>
    <text x="76" y="417" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">Dictée</text>
    <text x="500" y="417" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">on-device speech recognition straight into the composer, no audio leaves the phone</text>
  <circle cx="56" cy="442" r="6" fill="none" stroke="#d8a35f" stroke-width="1.4"/><circle cx="56" cy="442" r="2" fill="#d8a35f"/>
    <text x="76" y="447" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">Terminal</text>
    <text x="500" y="447" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">a terminal with ^C and ^D armed, the last capture pinned, a row of special keys</text>
  <path d="M49 465 h9 l5 5 v11 h-14 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="477" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">Réglages</text>
    <text x="500" y="477" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">server, orchestrator and alert settings, and the build signature</text>
  <path d="M56 494 l8 3 v7 c0 5 -4 9 -8 11 c-4 -2 -8 -6 -8 -11 v-7 z" fill="none" stroke="#d8a35f" stroke-width="1.4"/>
    <text x="76" y="507" font-family="ui-monospace,'SF Mono',Consolas,monospace" font-size="12.5" fill="#1f2328">Diagnostic</text>
    <text x="500" y="507" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12.5" fill="#3b4149">a chain probe, hidden behind a long press on the version number</text>
</svg>